<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <section class="card">
            <h1>TaskFlow</h1>
            <p class="subtitle">A simple and clean to-do list</p>

            <form id="taskForm" class="input-row">
                <input id="taskInput" type="text" placeholder="Enter a task..." maxlength="100" autocomplete="off">
                <button type="submit">Add Task</button>
            </form>

            <div class="toolbar">
                <div class="filters">
                    <button class="filter active" data-filter="all">All</button>
                    <button class="filter" data-filter="active">Active</button>
                    <button class="filter" data-filter="completed">Completed</button>
                </div>
                <button id="clearCompleted" class="text-button">Clear completed</button>
            </div>

            <ul id="taskList"></ul>
            <p id="emptyMessage" class="empty">No tasks yet. Add your first task!</p>

            <div class="footer">
                <span id="taskCount">0 tasks remaining</span>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
